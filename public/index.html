  // Delt sperre for statusendringer som IKKE bare er en enkel flytting i
  // tavla, men som påstår noe som må være faktisk sant: "Publisert" krever
  // fullført STOPP-kontroll, og "WP-utkast opprettet" krever at et ekte
  // WordPress-utkast faktisk finnes (wpPostId) — ellers kan en sak havne i
  // denne kolonnen (via dra-og-slipp, hurtigknapp eller Lagre i saksskjemaet)
  // uten at noe noensinne ble sendt til WordPress. Bruk alltid knappen
  // «🌐 Publiser til WordPress», som både oppretter det ekte utkastet OG
  // setter status, i ett steg.
  // prevStatus gis eksplisitt (ikke lest fra c.status inni funksjonen) fordi
  // saveCaseFromForm sitt kallested deler samme objektreferanse mellom "før"
  // og "det redigerte skjemaet" — c.status kan alt være mutert til newStatus
  // før dette kalles, så en intern c.status-sjekk ville aldri truffet der.
  function blockedStatusChangeReason(c, newStatus, prevStatus) {
    if (newStatus === "publisert" && !(c.stoppGodkjent && c.publisertAv)) {
      return "Åpne saken og fullfør STOPP-kontrollen før den kan publiseres";
    }
    if (newStatus === "wp-utkast" && prevStatus !== "wp-utkast" && !c.wpPostId) {
      return "«WP-utkast opprettet» kan ikke settes manuelt — åpne saken og bruk knappen «🌐 Publiser til WordPress», den oppretter det faktiske utkastet i WordPress og setter status samtidig.";
    }
    return null;
  }

  async function trySetStatus(c, newStatus, methodLabel) {
    var prevStatus = c.status;
    if (newStatus === prevStatus) return true;
    var blocked = blockedStatusChangeReason(c, newStatus, prevStatus);
    if (blocked) {
      showToast(blocked);
      state.ui.activeCaseId = c.id; state.ui.modal = "case"; render();
      return false;
    }
    var historikk = [{ ts: nowIso(), text: "Status endret (" + methodLabel + "): " + statusLabel(prevStatus) + " → " + statusLabel(newStatus) }].concat(c.historikk);
    var ok = await updateCase(c.id, { status: newStatus, historikk: historikk });
    if (ok) { showToast("Status oppdatert"); await refreshAndRender(); }
    return ok;
  }

  function handleDragStart(e) {
    draggedId = e.currentTarget.getAttribute("data-id");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", draggedId); } catch (err) {}
    e.currentTarget.classList.add("dragging");
  }
  function handleDragEnd(e) { e.currentTarget.classList.remove("dragging"); draggedId = null; }
  function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
  function handleDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
  function handleDrop(e) {
    e.preventDefault(); e.currentTarget.classList.remove("drag-over");
    var id = draggedId || e.dataTransfer.getData("text/plain");
    var newStatus = e.currentTarget.getAttribute("data-status");
    var c = getCase(id);
    if (!c || !newStatus) return;
    trySetStatus(c, newStatus, "dra-og-slipp");
  }

  function handleAction(e) {
    var action = e.currentTarget.getAttribute("data-action");
    if (action === "close-modal-bg" && e.target !== e.currentTarget) return;
    // Lukk mobilmenyen automatisk når noe i den (eller ellers i appen) trykkes
    // — ellers blir den stående åpen "under" en modal som åpnes fra den.
    if (action !== "toggle-mobile-menu" && state.ui.mobileMenuOpen) state.ui.mobileMenuOpen = false;
    switch (action) {
      case "set-view": state.ui.view = e.currentTarget.getAttribute("data-view"); persistView(); render(); break;
      case "assist-toast-open": {
        e.stopPropagation();
        var atId = e.currentTarget.getAttribute("data-id"), atCase = getCase(atId);
        delete state.ui.assistWatch[atId];
        state.ui.activeCaseId = atId; state.ui.modal = "case";
        state.ui.manusExpanded = !!(atCase && (atCase.manusTittel || (atCase.manusHovedtekst || []).length) && statusAtOrAfter(atCase.status, "i-arbeid"));
        state.ui.manusPreviewMode = state.ui.manusExpanded;
        render();
        break;
      }
      case "assist-toast-dismiss": e.stopPropagation(); delete state.ui.assistWatch[e.currentTarget.getAttribute("data-id")]; render(); break;
      case "set-list-status": state.ui.listStatus = e.currentTarget.getAttribute("data-status"); render(); break;
      case "toggle-card-collapse": {
        e.stopPropagation();
        var tcId = e.currentTarget.getAttribute("data-id");
        state.ui.expandedCards[tcId] = !state.ui.expandedCards[tcId];
        render();
        break;
      }
      case "collapse-all-cards": state.ui.expandedCards = {}; render(); break;
      case "expand-all-cards": {
        visibleCases().forEach(function (vc) { if (vc.status !== "ide") state.ui.expandedCards[vc.id] = true; });
        render();
        break;
      }
      case "toggle-aside": state.ui.asideOpen = !state.ui.asideOpen; render(); break;
      case "toggle-mobile-menu": state.ui.mobileMenuOpen = !state.ui.mobileMenuOpen; render(); break;
      case "open-chat": state.ui.asideOpen = true; state.ui.asideTab = "chat"; render(); focusChatInput(); break;
      case "set-aside-tab": state.ui.asideTab = e.currentTarget.getAttribute("data-tab"); render(); if (state.ui.asideTab === "chat") focusChatInput(); break;
      case "open-new-case": state.ui.modal = "new-case"; state.ui.newCaseTab = "lenke"; render(); break;
      case "set-new-case-tab": state.ui.newCaseTab = e.currentTarget.getAttribute("data-tab"); render(); break;
      case "open-case": state.ui.activeCaseId = e.currentTarget.getAttribute("data-id"); state.ui.modal = "case"; state.ui.manusExpanded = false; state.ui.manusPreviewMode = false; render(); break;
      case "preview-manus":
        e.stopPropagation();
        state.ui.activeCaseId = e.currentTarget.getAttribute("data-id");
        state.ui.modal = "case";
        state.ui.manusExpanded = true;
        // Husk at vi kom inn via snarveien (ikke ved å åpne saken normalt og
        // trykke ⛶ Forstørre selv) — se "toggle-manus-expand" under, som
        // bruker dette til å gå rett til forsiden i stedet for inn i den
        // fulle saks-modalen når man trykker "Vis normalt" herfra.
        state.ui.manusPreviewMode = true;
        render();
        break;
      case "quick-publish":
        e.stopPropagation();
        state.ui.activeCaseId = e.currentTarget.getAttribute("data-id");
        state.ui.modal = "publish-quick";
        render();
        break;
      case "open-weights": state.ui.modal = "weights"; render(); break;
      case "open-sources": openSources(); break;
      case "open-archive": state.ui.modal = "archive"; render(); break;
      case "restore-case": {
        var restoreId = e.currentTarget.getAttribute("data-id");
        var restoreCase = getCase(restoreId);
        if (restoreCase) trySetStatus(restoreCase, "ide", "gjenopprettet fra arkiv");
        break;
      }
      case "toggle-filter-panel": state.ui.filterPanelOpen = !state.ui.filterPanelOpen; render(); break;
      case "toggle-filter-group": {
        var dim = e.currentTarget.getAttribute("data-dim");
        state.ui.filterGroupsOpen[dim] = !state.ui.filterGroupsOpen[dim];
        render();
        break;
      }
      case "reset-filters": state.ui.filters = { tema: null, land: null, sakstype: null }; render(); break;
      case "toggle-title-group": {
        var groupId = e.currentTarget.getAttribute("data-id");
        state.ui.expandedTitleGroups[groupId] = !state.ui.expandedTitleGroups[groupId];
        render();
        break;
      }
      case "delete-case-quick": e.stopPropagation(); quickDeleteCase(e.currentTarget.getAttribute("data-id")); break;
      case "reject-case-quick": e.stopPropagation(); rejectCaseQuick(e.currentTarget.getAttribute("data-id")); break;
      case "delete-selected": deleteSelected(); break;
      case "clear-selection": state.ui.selectedIds = {}; render(); break;
      case "import-sources": importSources(); break;
      case "delete-source": deleteSource(e.currentTarget.getAttribute("data-id")); break;
      case "import-keywords": importKeywords(); break;
      case "delete-keyword": deleteKeyword(e.currentTarget.getAttribute("data-id")); break;
      case "run-ai-triage-bulk": runAiTriageBulk(); break;
      case "run-ai-triage-selected": e.stopPropagation(); runAiTriageSelected(); break;
      case "generate-manus": e.stopPropagation(); generateManuscriptForCase(e.currentTarget.getAttribute("data-id")); break;
      case "toggle-manus-expand": {
        e.stopPropagation();
        // Ta vare på det som alt er skrevet i feltene FØR modalen tegnes på
        // nytt (render() bygger HTML-en fra state.cases, ikke fra live
        // skjemaverdier) — ellers ville uskrevet tekst forsvunnet ved bytte
        // til/fra forstørret visning.
        readCaseForm();
        if (state.ui.manusExpanded && state.ui.manusPreviewMode) {
          // Kom inn via "👁️ Forhåndsvis manus"-snarveien på kortet — "Vis
          // normalt" skal da gå rett til forsiden, ikke inn i den fulle
          // saks-modalen, som brukeren i så fall aldri ba om å se.
          state.ui.modal = null;
          state.ui.activeCaseId = null;
          state.ui.manusExpanded = false;
          state.ui.manusPreviewMode = false;
        } else {
          state.ui.manusExpanded = !state.ui.manusExpanded;
        }
        render();
        break;
      }
      case "check-source": e.stopPropagation(); checkSourceForCase(e.currentTarget.getAttribute("data-id")); break;
      case "research-images": e.stopPropagation(); researchImagesForCase(e.currentTarget.getAttribute("data-id")); break;
      case "download-manus": e.stopPropagation(); downloadManus(e.currentTarget.getAttribute("data-id"), e.currentTarget.getAttribute("data-path")); break;
      case "approve-case-quick": e.stopPropagation(); approveCaseQuick(e.currentTarget.getAttribute("data-id")); break;
      case "advance-status-quick": {
        e.stopPropagation();
        var advId = e.currentTarget.getAttribute("data-id");
        var advNext = e.currentTarget.getAttribute("data-next");
        var advCase = getCase(advId);
        if (advCase) trySetStatus(advCase, advNext, "hurtigknapp");
        break;
      }
      case "generate-manus-selected": e.stopPropagation(); generateManuscriptsForSelected(); break;
      case "publish-wordpress": e.stopPropagation(); publishToWordPress(e.currentTarget.getAttribute("data-id")); break;
      case "publish-wordpress-selected": e.stopPropagation(); publishToWordPressSelected(); break;
      case "toggle-summary": {
        e.stopPropagation();
        var sid = e.currentTarget.getAttribute("data-id");
        if (state.ui.expandedSummaries[sid]) delete state.ui.expandedSummaries[sid];
        else state.ui.expandedSummaries[sid] = true;
        render();
        break;
      }
      case "open-source": {
        e.stopPropagation();
        var url = e.currentTarget.getAttribute("data-url");
        if (url) window.open(url, "_blank", "noopener,noreferrer");
        break;
      }
      case "approve-selected": e.stopPropagation(); approveSelected(); break;
      case "move-selected": e.stopPropagation(); moveSelected(document.getElementById("bulk-status-select").value); break;
      case "close-modal": case "close-modal-bg": state.ui.modal = null; state.ui.activeCaseId = null; state.ui.manusExpanded = false; state.ui.manusPreviewMode = false; render(); break;
      case "submit-new-tip": submitNewTip(); break;
      case "submit-new-content-batch": submitNewContentBatch(); break;
      case "submit-new-case-material": submitNewCaseFromMaterial(); break;
      case "submit-new-case-link": submitNewCaseFromLink(); break;
      case "submit-new-case-upload": submitNewCaseFromUpload(); break;
      case "submit-new-case-audio": submitNewCaseFromAudio(); break;
      case "assist-send": e.stopPropagation(); (function () { var id = e.currentTarget.getAttribute("data-id"); var el = document.getElementById("case-chat-input"); sendAssistantMessage(id, el ? el.value : ""); })(); break;
      case "assist-quick": e.stopPropagation(); sendAssistantMessage(e.currentTarget.getAttribute("data-id"), e.currentTarget.getAttribute("data-prompt")); break;
      case "save-case": saveCaseFromForm(); break;
      case "save-manus-inline": e.stopPropagation(); saveManusInline(); break;
      case "publish-case": publishCaseFromForm(); break;
      case "delete-case": deleteActiveCase(); break;
      case "add-kilde": addKildeRow(); break;
      case "remove-kilde": removeKildeRow(parseInt(e.currentTarget.getAttribute("data-idx"), 10)); break;
      case "save-weights": saveWeights(); break;
      case "sign-out": signOut(); break;
    }
  }

  async function submitNewCaseFromLink() {
    var input = document.getElementById("nc-link");
    var url = input ? input.value.trim() : "";
    if (!url) { if (input) input.focus(); showToast("Lim inn en lenke først"); return; }
    state.ui.newCaseBusy = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/create-case-from-link", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ url: url })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "Kunne ikke opprette sak fra lenke"); return; }

      // Saken finnes nå — fyr av selve manusgenereringen i bakgrunnen (ekte
      // gpt-5-search-api-kall, kan ta et halvt minutt+) i stedet for å vente
      // blokkerende på den (ga i praksis HTTP 504 av og til, se
      // generate-manuscript-background.js).
      fetch("/.netlify/functions/generate-manuscript-background", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: data.caseId })

  var MAX_UPLOAD_BYTES = 15 * 1024 * 1024;

  async function submitNewCaseFromUpload() {
    var input = document.getElementById("nc-file");
    var file = input && input.files && input.files[0];
    if (!file) { showToast("Velg en .docx-fil først"); return; }
    if (!/\.docx$/i.test(file.name)) { showToast("Kun .docx-filer støttes"); return; }
    if (file.size > MAX_UPLOAD_BYTES) { showToast("Filen er for stor (maks 15 MB)"); return; }

    state.ui.newCaseBusy = true;
    render();
    try {
      var path = "uploads/" + Date.now() + "-" + file.name.replace(/[^a-z0-9.\-_]/gi, "_");
      var uploadRes = await supabase.storage.from("manus").upload(path, file);
      if (uploadRes.error) { showToast("Kunne ikke laste opp filen: " + uploadRes.error.message); return; }

      var res = await fetch("/.netlify/functions/import-manuscript", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ storagePath: path, filename: file.name })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "Kunne ikke lese opplastet manus"); return; }
      showToast("Sak opprettet fra opplastet manus: " + data.title);
      if (data.usikkerhetsnotat) showToast("⚠️ " + data.usikkerhetsnotat);
      await openCreatedCase(data.caseId);
    } catch (err) {
      showToast("Kunne ikke opprette sak fra opplastet manus: " + err.message);
    } finally {
      state.ui.newCaseBusy = false;
      render();
    }
  }

  var MAX_AUDIO_UPLOAD_BYTES = 500 * 1024 * 1024; // 500 MB — romslig margin over et 45 min opptak

  // Lydfilen (og evt. bilder) lastes DIREKTE til Supabase Storage fra
  // nettleseren her — akkurat som submitNewCaseFromUpload gjør med .docx-
  // filer — i stedet for å sende dem via en Netlify-funksjon, som har en
  // størrelsesgrense et 30-45 min lydopptak fort ville sprengt. Selve saken
  // opprettes RASKT og synkront (samme mønster som resten av "+ Ny sak"),
  // og brukeren havner rett inne i den — transkribering/manusgenerering
  // skjer i en Background Function og dukker opp live via historikken
  // (Supabase Realtime, allerede koblet opp) når den er ferdig.
  // Lagringsnøkler tåler ikke alle tegn — gjør filnavnet trygt, men fortsatt
  // lesbart (æøå → ae/o/aa). Serveren viser navnet tilbake i historikken.
  function safeStorageName(name) {
    return String(name || "fil").replace(/[æÆ]/g, "ae").replace(/[øØ]/g, "o").replace(/[åÅ]/g, "aa")
      .replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80) || "fil";
  }

  // "Fra dokument/lenker": laster dokumentene rett til lagring, oppretter N
  // plassholder-saker og ber en Background Function skrive dem
  // (lib/documentCases.js) ut fra dokumentene, lenkene og fritekst-forklaringen.
  async function submitNewCaseFromMaterial() {
    var filesInput = document.getElementById("nc-mat-files");
    var files = filesInput && filesInput.files ? Array.prototype.slice.call(filesInput.files) : [];
    var links = (document.getElementById("nc-mat-links").value || "").split(/\s+/).map(function (x) { return x.trim(); }).filter(Boolean);
    var beskrivelse = (document.getElementById("nc-mat-beskrivelse").value || "").trim();
    var antall = parseInt(document.getElementById("nc-mat-antall").value, 10);
    if (isNaN(antall) || antall < 1) antall = 1;
    if (antall > 8) antall = 8;
    var sakstype = document.getElementById("nc-mat-type").value === "content" ? "content" : "redaksjonell";
    var nettsted = document.getElementById("nc-mat-site").value || "dronemag.no";

    if (!files.length && !links.length) { showToast("Last opp minst ett dokument eller legg inn minst én lenke"); return; }
    if (!beskrivelse) { document.getElementById("nc-mat-beskrivelse").focus(); showToast("Forklar hva materialet inneholder og hva sakene skal inneholde"); return; }
    var badLink = links.find(function (u) { return !/^https?:\/\//i.test(u); });
    if (badLink) { showToast('Lenken "' + badLink + '" må starte med http:// eller https://'); return; }
    if (files.length > 10) { showToast("Maks 10 filer om gangen"); return; }
    var tooBig = files.find(function (f) { return f.size > 25 * 1024 * 1024; });
    if (tooBig) { showToast('Filen "' + tooBig.name + '" er for stor (maks 25 MB per fil)'); return; }
    if (files.reduce(function (n, f) { return n + f.size; }, 0) > 45 * 1024 * 1024) { showToast("Filene er til sammen for store (maks 45 MB totalt)"); return; }
    var badType = files.find(function (f) { return !/\.(pdf|docx|txt|md)$/i.test(f.name); });
    if (badType) { showToast('«' + badType.name + '» støttes ikke — bruk PDF, Word (.docx) eller tekst'); return; }
    if (!state.session) { showToast("Du må være innlogget"); return; }

    state.ui.newCaseBusy = true;
    render();
    try {
      var stamp = Date.now();
      var docPaths = [];
      for (var f = 0; f < files.length; f++) {
        var path = "dokumenter/" + stamp + "-" + (f + 1) + "-" + safeStorageName(files[f].name);
        var up = await supabase.storage.from("manus").upload(path, files[f], { contentType: files[f].type || "application/octet-stream" });
        if (up.error) { showToast('Kunne ikke laste opp "' + files[f].name + '": ' + up.error.message); return; }
        docPaths.push(path);
      }

      var kildeTekst = files.length + " dokument(er)" + (links.length ? " og " + links.length + " lenke(r)" : "");
      var caseIds = [];
      for (var i = 1; i <= antall; i++) {
        var created = await createCase({
          title: "⏳ Sak " + i + " av " + antall + " fra " + kildeTekst + " — produseres …",
          sakstype: sakstype, status: "i-arbeid", nettsted: nettsted,
          wp_kategori: sakstype === "content" ? ["INFO"] : [],
          neste_handling: "Kontroller mot originalmaterialet og gå gjennom kontrollpunktene før publisering",
          kilder: links,
          historikk: [{ ts: nowIso(), text: "📎 Bestilt fra " + kildeTekst + " (" + i + " av " + antall + "): " + beskrivelse.slice(0, 300) }]
        });
        if (!created) { showToast("Avbrøt bestillingen — kunne ikke opprette sak " + i); break; }
        caseIds.push(created.id);
      }
      if (!caseIds.length) return;

      fetch("/.netlify/functions/generate-cases-from-material-background", {
        method: "POST", headers: authHeader(),
        body: JSON.stringify({ caseIds: caseIds, docPaths: docPaths, links: links, beskrivelse: beskrivelse, sakstype: sakstype })
      }).catch(function () {});

      state.ui.modal = null;
      await refreshAndRender();
      showToast(caseIds.length + " sak(er) bestilt — de fylles ut i «I arbeid» om ca. 3–5 minutter (følg fremdriften i historikken)");
    } catch (err) {
      showToast("Kunne ikke lage saker fra materialet: " + err.message);
    } finally {
      state.ui.newCaseBusy = false;
      render();
    }
  }

  // "Bestill innhold": oppretter N plassholder-saker (så fremdriften synes
  // med en gang i «I arbeid») og ber en Background Function fylle dem med

  async function submitNewCaseFromAudio() {
    var audioInput = document.getElementById("nc-audio");
    var audioFiles = audioInput && audioInput.files ? Array.prototype.slice.call(audioInput.files) : [];
    if (!audioFiles.length) { showToast("Velg minst én lydfil først"); return; }
    var tooBig = audioFiles.find(function (f) { return f.size > MAX_AUDIO_UPLOAD_BYTES; });
    if (tooBig) { showToast('Filen "' + tooBig.name + '" er for stor (maks 500 MB per fil)'); return; }
    if (!state.session) { showToast("Du må være innlogget"); return; }

    var imagesInput = document.getElementById("nc-audio-images");
    var imageFiles = imagesInput && imagesInput.files ? Array.prototype.slice.call(imagesInput.files) : [];
    var arbeidstittel = (document.getElementById("nc-audio-title").value || "").trim();
    var aiNotat = (document.getElementById("nc-audio-notat").value || "").trim();

    state.ui.newCaseBusy = true;
    render();
    try {
      var prefix = "lydopptak/" + Date.now();
      var audioPaths = [];
      for (var a = 0; a < audioFiles.length; a++) {
        var audioExt = (audioFiles[a].name.match(/\.[a-zA-Z0-9]+$/) || [".m4a"])[0];
        var audioPath = prefix + "-opptak" + (a + 1) + audioExt;
        var audioUpload = await supabase.storage.from("manus").upload(audioPath, audioFiles[a], { contentType: audioFiles[a].type || "audio/mp4" });
        if (audioUpload.error) { showToast('Kunne ikke laste opp "' + audioFiles[a].name + '": ' + audioUpload.error.message); return; }
        audioPaths.push(audioPath);
      }

      var imagePaths = [];
      for (var i = 0; i < imageFiles.length; i++) {
        var imgExt = (imageFiles[i].name.match(/\.[a-zA-Z0-9]+$/) || [".jpg"])[0];
        var imgPath = prefix + "-bilde" + (i + 1) + imgExt;
        var imgUpload = await supabase.storage.from("manus").upload(imgPath, imageFiles[i], { contentType: imageFiles[i].type || "image/jpeg" });
        if (imgUpload.error) { showToast("Kunne ikke laste opp bilde " + (i + 1) + ": " + imgUpload.error.message); continue; }
        imagePaths.push(imgPath);
      }

      var nowIsoStr = nowIso();
      var created = await createCase({
        title: arbeidstittel || "(Lydopptak — tittel ikke satt ennå)",
        status: "i-arbeid",
        historikk: [{ ts: nowIsoStr, text: "🎙️ " + audioPaths.length + " lydopptak lastet opp, transkriberes automatisk (kan ta noen minutter for lengre/flere opptak) …" }]
      });
      if (!created) return;

      // Fyr av bakgrunnsjobben og vent IKKE på svaret — den svarer 202 med
      // en gang og fortsetter selve arbeidet server-side. Feiler selve
      // HTTP-kallet (nettverk), er ikke det kritisk her: saken finnes
      // allerede og kan da regenereres manuelt fra saken selv.
      fetch("/.netlify/functions/transcribe-audio-background", {
        method: "POST", headers: authHeader(),
        body: JSON.stringify({ caseId: created.id, audioPaths: audioPaths, imagePaths: imagePaths, aiNotat: aiNotat })
      }).catch(function () {});

      showToast("Sak opprettet — transkriberer lydopptaket i bakgrunnen");
      await openCreatedCase(created.id);
    } catch (err) {
      showToast("Kunne ikke opprette sak fra lydopptak: " + err.message);
    } finally {
      state.ui.newCaseBusy = false;
      render();
    }
  }

  function readCaseForm() {
    var c = getCase(state.ui.activeCaseId);
    if (!c) return null;
    root.querySelectorAll("[data-field]").forEach(function (el) { c[el.getAttribute("data-field")] = el.value; });
    root.querySelectorAll("[data-triage]").forEach(function (el) { c.triage[el.getAttribute("data-triage")] = parseInt(el.value, 10); });
    var kildeInputs = root.querySelectorAll("[data-kilde-idx]");
    if (kildeInputs.length) c.kilder = Array.prototype.map.call(kildeInputs, function (el) { return el.value; });
    // Hovedtekst redigeres som én sammenhengende tekst (blank linje = nytt
    // avsnitt) i stedet for data-field, siden det lagres som en liste med
    // avsnitt (manus_hovedtekst), ikke en enkel streng.
    var hovedtekstEl = document.getElementById("c-manus-hovedtekst");
    if (hovedtekstEl) {
      c.manusHovedtekst = hovedtekstEl.value.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
    }
    // Kategori: flere avkrysningsbokser, ikke ett data-field-element — samles
    // til en liste med de som faktisk er avkrysset.
    var kategoriChecks = root.querySelectorAll(".wp-kategori-check");
    if (kategoriChecks.length) {
      c.wpKategori = Array.prototype.filter.call(kategoriChecks, function (el) { return el.checked; }).map(function (el) { return el.value; });
    }
    return c;
  }

    var msg;
    if (ideCases.length && otherIds.length) {
      msg = "Arkivere " + ideCases.length + " idé-sak(er) og slette " + otherIds.length + " annen/andre sak(er) permanent?";

      msg = "Slette " + otherIds.length + " valgte sak(er) permanent? Dette kan ikke angres.";

  async function generateManuscriptsForSelected() {
    var ids = Object.keys(state.ui.selectedIds);
    if (!ids.length) return;
    state.ui.selectedIds = {};
    render();

    // Trigger-kall — svarer raskt (202), selve genereringen skjer i
    // bakgrunnen per sak (generate-manuscript-background.js). Vi venter ikke
    // på et samlet "N generert"-resultat lenger; se historikken på hver sak.
    var results = await Promise.allSettled(ids.map(async function (id) {
      var res = await fetch("/.netlify/functions/generate-manuscript-background", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      if (!res.ok) { var data = await parseFunctionResponse(res).catch(function () { return {}; }); throw new Error(data.error || "ukjent feil"); }
    }));

    var startet = 0, failed = [];
    results.forEach(function (r, i) {
      if (r.status === "fulfilled") startet++;
      else failed.push({ id: ids[i], error: r.reason ? r.reason.message : "ukjent feil" });
    });

    var msg = startet + " sak(er) sendt til manusgenerering i bakgrunnen — følg med i historikken på hver sak";
    if (failed.length) msg += ", " + failed.length + " kunne ikke startes";
    showToast(msg);
    if (failed.length) console.warn("Kunne ikke starte manusgenerering for:", failed);
  }

  async function publishToWordPress(id) {
    // Lagre alt som står i skjemaet (særlig stikkord/kategori/byline, som
    // kun redigeres her og ellers aldri ville blitt lagret) FØR selve
    // publiseringskallet — som leser saken fra databasen, ikke fra skjermen.
    var formCase = readCaseForm();
    if (formCase) {
      var saved = await updateCase(formCase.id, caseToDbUpdate(formCase));
      if (!saved) return; // updateCase har allerede vist en feilmelding
    }
    state.ui.wpBusy[id] = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/publish-to-wordpress", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) {
        if (data.missingFields && data.missingFields.length) {
          window.alert("Kan ikke opprette WordPress-utkast — saken mangler:\n\n• " + data.missingFields.join("\n• ") + "\n\nRediger saken (eller generer manus på nytt) og prøv igjen.");
        } else {
          showToast(data.error || "Kunne ikke publisere til WordPress");
        }
        return;
      }
      showToast("WordPress-utkast opprettet: " + data.title + (data.usedAcfFields === false ? " (kun standardfelt — sjekk visningen i WP)" : ""));
      await refreshAndRender();
    } catch (err) {
      showToast("Kunne ikke publisere til WordPress: " + err.message);
    } finally {
      delete state.ui.wpBusy[id];
      render();
    }
  }

  async function publishToWordPressSelected() {

    state.ui.selectedIds = {};
    ids.forEach(function (id) { state.ui.wpBusy[id] = true; });
    render();

    var results = await Promise.allSettled(ids.map(async function (id) {
      var res = await fetch("/.netlify/functions/publish-to-wordpress", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { var err = new Error(data.error || "ukjent feil"); err.missingFields = data.missingFields; throw err; }
      return data;
    }));

    var published = [], failed = [];
    results.forEach(function (r, i) {
      var c = getCase(ids[i]);
      var title = c ? c.title : ids[i];
      if (r.status === "fulfilled") published.push({ title: r.value.title, editLink: r.value.editLink, nettsted: r.value.nettsted });
      else failed.push({ title: title, error: r.reason ? r.reason.message : "ukjent feil", missingFields: r.reason && r.reason.missingFields });
    });

    ids.forEach(function (id) { delete state.ui.wpBusy[id]; });
    state.ui.wpReport = { published: published, failed: failed };
    state.ui.modal = "wp-report";
    await refreshAndRender();
  }

  // Netlify-funksjoner returnerer alltid JSON når de faktisk kjører — men ved
  // tidsavbrudd (for store/trege forespørsler) eller andre serverfeil svarer
  // Netlify selv med en HTML-feilside i stedet. Uten dette gir et slikt svar
  // en kryptisk "Unexpected token '<'"-feil i stedet for noe brukbart.
  async function parseFunctionResponse(res) {
    var text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error(
        res.ok
          ? "Fikk et uventet svar fra serveren (ikke gyldig JSON)."
          : "Serverfunksjonen svarte ikke som forventet (HTTP " + res.status + ") — sannsynligvis tidsavbrudd fordi forespørselen tok for lang tid. Prøv med færre saker om gangen."
      );
    }
  }

  async function sendChatMessage() {
    var input = document.getElementById("chat-input");
    var text = input ? input.value.trim() : "";
    if (!text || state.chat.busy) return;

    var history = state.chat.messages
      .filter(function (m) { return m.role === "user" || m.role === "assistant"; })
      .map(function (m) { return { role: m.role, content: m.content }; });

    state.chat.messages.push({ role: "user", content: text });
    state.chat.busy = true;
    render();

    try {
      var res = await fetch("/.netlify/functions/assistant-chat", {
        method: "POST", headers: authHeader(),
        body: JSON.stringify({ message: text, history: history })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) {
        state.chat.messages.push({ role: "error", content: data.error || "Assistenten svarte ikke." });
      } else {
        state.chat.messages.push({ role: "assistant", content: data.reply || "(tomt svar)", actions: data.actions || [] });
        if (data.actions && data.actions.length) await fetchCases();
      }
    } catch (err) {
      state.chat.messages.push({ role: "error", content: err.message });
    } finally {
      state.chat.busy = false;
      render();
      focusChatInput();
    }
  }

  // Manusgenerering (ekte gpt-5-search-api-kall — kan ta over et minutt) er
  // en Background Function (generate-manuscript-background.js) — vi venter
  // IKKE på et synkront svar lenger (det ga i praksis HTTP 504 av og til).
  // Trigger-kallet selv svarer nesten øyeblikkelig (202); resultatet dukker
  // opp live i saken sin historikk via Supabase Realtime (allerede koblet
  // opp) når jobben faktisk er ferdig.
  async function generateManuscriptForCase(id) {
    state.ui.manusBusy[id] = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/generate-manuscript-background", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      if (!res.ok) {
        var data = await parseFunctionResponse(res).catch(function () { return {}; });
        showToast(data.error || "Kunne ikke starte manusgenerering"); return;
      }
      showToast("Genererer manus i bakgrunnen (kan ta et halvt minutt) — følg med i historikken");
    } catch (err) {
      showToast("Kunne ikke starte manusgenerering: " + err.message);
    } finally {
      delete state.ui.manusBusy[id];
      render();
    }
  }

  async function checkSourceForCase(id) {
    state.ui.kildeBusy[id] = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/check-source", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "Kunne ikke kjøre kildevurdering"); return; }
      var kv = data.kildevurdering;
      showToast("Kildevurdering ferdig: " + kv.troverdighet_score + "/5 – " + kv.troverdighet_label);
      await refreshAndRender();
    } catch (err) {
      showToast("Kunne ikke kjøre kildevurdering: " + err.message);
    } finally {
      delete state.ui.kildeBusy[id];
      render();
    }
  }

  async function researchImagesForCase(id) {
    state.ui.bildeBusy[id] = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/research-images", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "Kunne ikke søke etter bilder"); return; }
      var bf = data.bildeforslag;
      var verified = (bf.alternativer || []).filter(function (a) { return a.verifisering && a.verifisering.lenke_virker; }).length;
      showToast("Bildeforslag ferdig: " + bf.alternativer.length + " forslag, " + verified + " med bekreftet fungerende lenke");
      await refreshAndRender();
    } catch (err) {
      showToast("Kunne ikke søke etter bilder: " + err.message);
    } finally {
      delete state.ui.bildeBusy[id];
      render();
    }
  }

  async function downloadManus(id, path) {
    var res = await supabase.storage.from("manus").download(path);
    if (res.error) { showToast("Kunne ikke laste ned manus: " + res.error.message); return; }
    var c = getCase(id);
    var filename = (c ? c.title.replace(/[^a-z0-9æøå]+/gi, "-").toLowerCase().slice(0, 60) : "manus") + ".docx";
    var url = URL.createObjectURL(res.data);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function showToast(msg) {
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  /* ---------- auth ---------- */

  var MS_ICON =
    '<svg width="18" height="18" viewBox="0 0 21 21" style="margin-right:9px;flex:none;">' +
      '<rect x="1" y="1" width="9" height="9" fill="#f25022"/>' +
      '<rect x="11" y="1" width="9" height="9" fill="#7fba00"/>' +
      '<rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>' +
      '<rect x="11" y="11" width="9" height="9" fill="#ffb900"/>' +
    "</svg>";

  function renderLoginScreen(status, statusType, showEmailForm) {
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">' +
        "<h1>Saksbank — UAS Norway</h1>" +
        "<p>Logg inn med Microsoft-kontoen din (samme som Outlook/Teams).</p>" +
        '<button class="btn btn-primary" id="login-microsoft" type="button" ' +
          'style="display:flex;align-items:center;justify-content:center;background:#2f2f2f;">' +
          MS_ICON + "Logg inn med Microsoft" +
        "</button>" +
        (status ? '<p class="login-status ' + (statusType || "") + '">' + escapeHtml(status) + "</p>" : "") +
        (showEmailForm
          ? ('<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:16px;">' +
              '<form id="login-form" class="field">' +
                '<label for="login-email">E-post</label>' +
                '<input id="login-email" type="email" required placeholder="navn@uasnorway.no" />' +
                '<button class="btn btn-primary" type="submit" style="margin-top:10px;">Send innloggingslenke</button>' +
              "</form>" +
            "</div>")
          : '<button class="btn btn-ghost" id="login-show-email" type="button" style="align-self:center;font-size:0.8rem;">Bruk e-post i stedet</button>') +
      "</div></div>";

    document.getElementById("login-microsoft").addEventListener("click", async function () {
      var res = await supabase.auth.signInWithOAuth({ provider: "azure", options: { scopes: "openid email profile" } });
      if (res.error) renderLoginScreen("Kunne ikke starte Microsoft-innlogging: " + res.error.message, "error", showEmailForm);
    });

    var showEmailBtn = document.getElementById("login-show-email");
    if (showEmailBtn) showEmailBtn.addEventListener("click", function () { renderLoginScreen(status, statusType, true); });

    var form = document.getElementById("login-form");
    if (form) form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      if (!email) return;
      var res = await supabase.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin } });
      if (res.error) renderLoginScreen("Kunne ikke sende lenke: " + res.error.message, "error", true);
      else renderLoginScreen("Sjekk innboksen til " + email + " for innloggingslenken.", "ok", true);
    });
  }

  function renderNotConfiguredScreen() {
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">' +
        "<h1>Saksbank — ikke koblet til database ennå</h1>" +
        '<p>SUPABASE_URL og SUPABASE_ANON_KEY er ikke fylt inn i <code>public/index.html</code>. Se README.md for stegene.</p>' +
      "</div></div>";
  }

  function signOut() { supabase.auth.signOut(); }

  var realtimeChannel = null;
  function subscribeRealtime() {
    if (realtimeChannel) return;
    realtimeChannel = supabase
      .channel("cases-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "cases" }, function () {
        refreshAndRender();
      })
      .subscribe(function (status) {
        state.realtimeOk = status === "SUBSCRIBED";
        render();
      });
  }

  function readAuthErrorFromUrl() {
    // Etter en mislykket Microsoft-innlogging (f.eks. avvist av domenesperren,
    // eller avbrutt av brukeren) sender Supabase oss tilbake med feildetaljer
    // i URL-en (enten som ?error=... eller #error=...) i stedet for å faktisk
    // logge inn. Uten dette leses feilen aldri — brukeren havner da stille
    // tilbake på innloggingssiden uten noen forklaring.
    var raw = (window.location.search || "").replace(/^\?/, "") + "&" + (window.location.hash || "").replace(/^#/, "");
    var params = new URLSearchParams(raw);
    var msg = params.get("error_description") || params.get("error");
    if (msg) {
      history.replaceState(null, "", window.location.pathname);
      return msg.replace(/\+/g, " ");
    }
    return null;
  }

  async function boot() {
    if (!CONFIGURED) { renderNotConfiguredScreen(); return; }

    var authError = readAuthErrorFromUrl();

    var sessionRes = await supabase.auth.getSession();
    state.session = sessionRes.data.session;

    supabase.auth.onAuthStateChange(function (_event, session) {
      state.session = session;
      if (session) { subscribeRealtime(); refreshAndRender(); }
      else { renderLoginScreen(authError ? "Innlogging feilet: " + authError : null, authError ? "error" : null); authError = null; }
    });

    if (!state.session) { renderLoginScreen(authError ? "Innlogging feilet: " + authError : null, authError ? "error" : null); return; }

    loadWeights();
    loadView();
    subscribeRealtime();
    await Promise.all([refreshAndRender(), fetchEvents()]);
    render();
    setInterval(function () {
      var running = Object.keys(state.ui.assistWatch).some(function (id) { return state.ui.assistWatch[id].status === "running"; });
      if (running && !state.ui.modal) refreshAndRender();
    }, 10000);
  }

  boot();
})();
</script>
</body>
