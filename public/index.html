<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<title>Saksbank – UAS Norway</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --color-ink: #101820;
    --color-paper: #eef1ec;
    --color-accent: #3b6e8c;
    --color-accent-deep: #1f4a5f;
    --color-amber: #c97a2e;
    --color-green: #4c8b5d;
    --color-red: #b8503f;

    --bg: var(--color-paper);
    --bg-elevated: #ffffff;
    --bg-sunken: #e2e7e1;
    --text: var(--color-ink);
    --text-muted: #55605f;
    --border: rgba(16, 24, 32, 0.14);
    --accent: var(--color-accent);
    --accent-contrast: #ffffff;
    --focus: var(--color-accent-deep);

    --amber-bg: rgba(201, 122, 46, 0.14);
    --amber-fg: #8a5219;
    --green-bg: rgba(76, 139, 93, 0.14);
    --green-fg: #2f6b41;
    --red-bg: rgba(184, 80, 63, 0.14);
    --red-fg: #93392a;
    --yellow-bg: rgba(196, 162, 22, 0.18);
    --yellow-fg: #7a6008;
    --slate-bg: rgba(16, 24, 32, 0.07);
    --slate-fg: #55605f;
    --violet-bg: rgba(108, 79, 172, 0.14);
    --violet-fg: #5b3fa0;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1418; --bg-elevated: #141d22; --bg-sunken: #0a1013;
      --text: #e7ece9; --text-muted: #9aa6a2; --border: rgba(231, 236, 233, 0.14);
      --accent: #6fa8c9; --accent-contrast: #06131a; --focus: #8fc0dd;
      --amber-bg: rgba(224, 153, 84, 0.16); --amber-fg: #e0a262;
      --green-bg: rgba(115, 181, 132, 0.16); --green-fg: #7fc496;
      --red-bg: rgba(214, 120, 103, 0.18); --red-fg: #e08d7c;
      --yellow-bg: rgba(224, 196, 84, 0.2); --yellow-fg: #e0c454;
      --slate-bg: rgba(231, 236, 233, 0.08); --slate-fg: #9aa6a2;
      --violet-bg: rgba(167, 139, 250, 0.18); --violet-fg: #c4b5fd;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans);
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 60px; flex-shrink: 0;
    background: var(--bg-elevated); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-deep, var(--accent)));
    box-shadow: 0 0 0 3px var(--amber-bg); flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text .name { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .brand-text .sub { font-size: 0.72rem; color: var(--text-muted); }
  .topbar-spacer { flex: 1; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    font-weight: 600; font-size: 0.85rem; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-sunken); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--bg-sunken); }
  .btn-danger { color: var(--red-fg); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .badge-count {
    display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 9px; background: var(--amber-bg); color: var(--amber-fg);
    font-size: 0.68rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .live-dot {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-muted);
  }
  .live-dot::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green-fg);
  }
  .live-dot.offline::before { background: var(--red-fg); }

  .view-switch { display: flex; gap: 2px; background: var(--bg-sunken); padding: 2px; border-radius: 9px; }
  .btn-view { border: none; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 0.82rem; color: var(--text-muted); }
  .btn-view.active { background: var(--bg-elevated); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }

  .pilot-banner {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding: 8px 20px;
    background: var(--amber-bg); color: var(--amber-fg); font-size: 0.78rem; border-bottom: 1px solid var(--border);
  }
  .pilot-banner strong { font-weight: 700; }
  .pilot-banner-spacer { flex: 1; }
  .pilot-banner button.btn { padding: 4px 10px; font-size: 0.76rem; background: var(--bg-elevated); }
  .about-section { display: flex; flex-direction: column; gap: 6px; }
  .about-section h3 { font-size: 0.82rem; font-weight: 700; }
  .about-section p, .about-section li { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; }
  .about-section ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .about-ok { color: var(--green-fg); }
  .about-missing { color: var(--red-fg); }

  .main { flex: 1; display: flex; min-height: 0; }
  .board-wrap { flex: 1; overflow-x: auto; padding: 16px 12px; }
  .board { display: flex; gap: 12px; height: 100%; align-items: flex-start; }
  .column { flex: 0 0 272px; display: flex; flex-direction: column; background: var(--bg-sunken); border-radius: 12px; max-height: 100%; }
  .column-header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; position: sticky; top: 0; z-index: 1; }
  .column-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
  .column-count { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 0.72rem; }
  .column-body { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .column-empty { font-size: 0.78rem; color: var(--text-muted); padding: 12px 4px; text-align: center; }

  .list-wrap { flex: 1; overflow: auto; padding: 16px 20px; }
  .list-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .list-table th {
    text-align: left; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .list-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  .list-title { cursor: pointer; font-weight: 650; white-space: normal; }
  .list-title:hover { color: var(--accent); }
  .list-table td.overdue { color: var(--red-fg); font-weight: 700; }
  .list-table select { padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-elevated); color: var(--text); }

  .card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px;
    display: flex; flex-direction: column; gap: 7px; text-align: left; width: 100%; cursor: pointer; position: relative;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: 0.45; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card-top-row { display: flex; align-items: center; justify-content: space-between; }
  .card-delete { padding: 3px; opacity: 0.55; }
  .card-delete:hover { opacity: 1; color: var(--red-fg); }
  .card-summary { font-size: 0.76rem; color: var(--text-muted); line-height: 1.4; }
  .card-summary.empty { font-style: italic; opacity: 0.7; }
  .card-actions { display: flex; gap: 6px; margin-top: 2px; }
  .card-actions .btn { padding: 5px 9px; font-size: 0.76rem; flex: 1; justify-content: center; }
  .chip-event { background: transparent; color: var(--accent); border: 1px dashed var(--accent); }

  .selection-bar {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding: 8px 20px; flex-wrap: wrap;
    background: var(--bg-sunken); border-bottom: 1px solid var(--border); font-size: 0.82rem; font-weight: 600;
  }
  .selection-bar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-elevated); color: var(--text); font-weight: 600; font-size: 0.82rem; }
  .column-body.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; background: var(--bg-elevated); border-radius: 8px; }
  .chip-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .chip-type-redaksjonell { background: var(--slate-bg); color: var(--slate-fg); }
  .chip-type-content { background: var(--amber-bg); color: var(--amber-fg); }
  .chip-type-ai { background: var(--violet-bg); color: var(--violet-fg); }
  .chip-site { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .chip-urg-akutt { background: var(--red-bg); color: var(--red-fg); }
  .chip-urg-planlagt { background: var(--yellow-bg); color: var(--yellow-fg); }
  .chip-urg-tidlos { background: var(--green-bg); color: var(--green-fg); }
  .chip-rss { background: transparent; color: var(--text-muted); border: 1px dotted var(--border); }

  .card-title { font-size: 0.9rem; font-weight: 650; line-height: 1.3; }
  .card-meta { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); }
  .avatar {
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; flex-shrink: 0;
  }
  .meta-due { font-variant-numeric: tabular-nums; }
  .meta-due.overdue { color: var(--red-fg); font-weight: 700; }

  .score-row { display: flex; align-items: center; gap: 6px; }
  .score-meter { flex: 1; height: 4px; border-radius: 3px; background: var(--bg-sunken); overflow: hidden; }
  .score-fill { height: 100%; border-radius: 3px; }
  .score-num { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .aside { flex: 0 0 300px; border-left: 1px solid var(--border); background: var(--bg-elevated); display: flex; flex-direction: column; min-height: 0; }
  .aside-header { padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
  .aside-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
  .aside-list { flex: 1; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .aside-empty { font-size: 0.8rem; color: var(--text-muted); padding: 20px 8px; text-align: center; }
  .activity-item { display: flex; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg-sunken); font-size: 0.78rem; }
  .activity-item.alert { background: var(--amber-bg); }
  .activity-icon { flex-shrink: 0; font-size: 0.9rem; line-height: 1.4; }
  .activity-body b { font-weight: 700; }
  .activity-time { display: block; margin-top: 2px; font-size: 0.68rem; color: var(--text-muted); font-family: var(--font-mono); }

  .aside-tabs { display: flex; gap: 2px; padding: 0 12px 10px; }
  .aside-tab { flex: 1; border: none; background: var(--bg-sunken); color: var(--text-muted); padding: 6px 10px; border-radius: 7px; font-weight: 600; font-size: 0.76rem; }
  .aside-tab.active { background: var(--accent); color: var(--accent-contrast); }

  .chat-messages { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 0.83rem; line-height: 1.45; white-space: pre-wrap; }
  .chat-msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-contrast); }
  .chat-msg.assistant { align-self: flex-start; background: var(--bg-sunken); color: var(--text); }
  .chat-msg.error { align-self: center; background: var(--red-bg); color: var(--red-fg); font-size: 0.76rem; }
  .chat-actions { margin-top: 6px; font-size: 0.7rem; opacity: 0.75; }
  .chat-actions summary { cursor: pointer; }
  .chat-actions ul { margin: 4px 0 0; padding-left: 16px; }
  .chat-typing { align-self: flex-start; font-size: 0.78rem; color: var(--text-muted); font-style: italic; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .chat-input-row textarea { flex: 1; resize: none; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elevated); color: var(--text); font-size: 0.85rem; min-height: 38px; max-height: 100px; }
  .chat-input-row .btn { align-self: flex-end; }
  .chat-empty { font-size: 0.8rem; color: var(--text-muted); padding: 16px 8px; text-align: center; line-height: 1.5; }

  /* Skrivebord: panelet skal faktisk kunne lukkes med ✕, ikke bare på mobil */
  @media (min-width: 861px) {
    .aside { display: none; }
    .aside.open { display: flex; }
  }

  @media (max-width: 860px) {
    .aside { position: fixed; inset: 60px 0 0 0; z-index: 30; transform: translateX(100%); transition: transform 0.2s ease; flex: none; }
    .aside.open { transform: translateX(0); }
    @media (prefers-reduced-motion: reduce) { .aside { transition: none; } }
    .column { flex-basis: 84vw; scroll-snap-align: start; }
    .board { scroll-snap-type: x mandatory; }
    .brand-text .sub { display: none; }
  }

  .overlay { position: fixed; inset: 0; background: rgba(6, 10, 12, 0.5); display: flex; align-items: stretch; justify-content: flex-end; z-index: 40; }
  .overlay.center { align-items: center; justify-content: center; padding: 24px; }
  .panel { background: var(--bg); width: min(480px, 100vw); height: 100%; overflow-y: auto; box-shadow: -8px 0 24px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .overlay.center .panel { width: min(560px, 100%); height: auto; max-height: 88vh; border-radius: 14px; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .panel-header h2 { font-size: 1rem; }
  .panel-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
  .panel-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; position: sticky; bottom: 0; background: var(--bg); }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted); }
  .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-elevated); color: var(--text); width: 100%; }
  .field textarea { resize: vertical; min-height: 60px; font-family: var(--font-mono); font-size: 0.82rem; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .helper { font-size: 0.72rem; color: var(--text-muted); }
  .section-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 14px; margin-top: 2px; }

  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row label { flex: 0 0 110px; font-size: 0.78rem; color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; }
  .slider-row input[type="range"] { flex: 1; }
  .slider-row .val { width: 20px; text-align: right; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

  .stopp-box { border: 1px solid var(--amber-fg); background: var(--amber-bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .stopp-box.done { border-color: var(--green-fg); background: var(--green-bg); }
  .stopp-title { font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; }
  .checkline { display: flex; align-items: flex-start; gap: 8px; font-size: 0.82rem; }

  .kilder-list { display: flex; flex-direction: column; gap: 6px; }
  .kilde-row { display: flex; gap: 6px; }
  .kilde-row input { flex: 1; }
  .icon-btn { border: none; background: transparent; color: var(--text-muted); padding: 6px; border-radius: 6px; }
  .icon-btn:hover { background: var(--bg-sunken); color: var(--red-fg); }

  .history-item { font-size: 0.78rem; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .history-item:last-child { border-bottom: none; }
  .history-time { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); }

  .draft-box { font-family: var(--font-mono); font-size: 0.78rem; white-space: pre-wrap; background: var(--bg-sunken); border-radius: 8px; padding: 12px; border: 1px solid var(--border); max-height: 40vh; overflow-y: auto; }
  .newsletter-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .newsletter-item:last-child { border-bottom: none; }

  .weights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .weight-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.8rem; }
  .weight-field input { width: 52px; text-align: center; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 0.82rem; z-index: 60; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* login */
  .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: min(360px, 100%); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .login-card h1 { font-size: 1.1rem; }
  .login-card p { font-size: 0.85rem; color: var(--text-muted); }
  .login-status { font-size: 0.82rem; }
  .login-status.error { color: var(--red-fg); }
  .login-status.ok { color: var(--green-fg); }

  /* kilder */
  .source-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.83rem; }
  .source-row:last-child { border-bottom: none; }
  .source-main { flex: 1; min-width: 0; }
  .source-name { font-weight: 650; }
  .source-url { color: var(--text-muted); font-size: 0.72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source-meta { font-size: 0.68rem; color: var(--text-muted); font-family: var(--font-mono); }
  .import-report { display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
  .import-report .ok-line { color: var(--green-fg); }
  .import-report .warn-line { color: var(--amber-fg); }
  .import-report .fail-line { color: var(--red-fg); }
  .import-report ul { margin: 4px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-muted);font-size:0.85rem;">Laster …</div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  // ── Supabase-oppsett ────────────────────────────────────────────
  // Fyll inn etter at Supabase-prosjektet er opprettet (Project Settings → API).
  // Dette er anon/public-nøkkelen — den er trygg å ha i frontend-koden,

  function nowIso() { return new Date().toISOString(); }

    var d = new Date(iso);

      d.toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var target = new Date(dateStr + "T00:00:00");
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((target - today) / 86400000);
  }
  function fmtDue(dateStr) {
    if (!dateStr) return "Ingen frist";
    var n = daysUntil(dateStr);
    if (n < 0) return "Forfalt (" + Math.abs(n) + "d)";
    if (n === 0) return "I dag";
    if (n === 1) return "I morgen";
    return "Om " + n + " dager";
  }

  function statusAtOrAfter(status, target) {

  function computeScore(triage, weights) {
    var w = weights;
    var sumW = w.aktualitet + w.betydning + w.eksklusivitet + w.innsats;
    if (sumW <= 0) sumW = 1;
    var raw = (triage.aktualitet * w.aktualitet + triage.betydning * w.betydning +
      triage.eksklusivitet * w.eksklusivitet + (6 - triage.innsats) * w.innsats) / sumW;
    return Math.round((raw / 5) * 100);
  }

  function renderBoard() {
    var cols = STATUSES.map(function (s) {
      var items = state.cases.filter(function (c) { return c.status === s.id; }).sort(function (a, b) {
        return computeScore(b.triage, state.weights) - computeScore(a.triage, state.weights);
      });
      return (
        '<div class="column">' +
          '<div class="column-header"><span class="column-title">' + escapeHtml(s.label) + '</span><span class="column-count">' + items.length + "</span></div>" +

            (items.length ? items.map(renderCard).join("") : '<div class="column-empty">Ingen saker</div>') +
          "</div>" +
        "</div>"

    return '<div class="board-wrap"><div class="board">' + cols + "</div></div>";

  function renderCard(c) {
    var score = computeScore(c.triage, state.weights);

    var checked = !!state.ui.selectedIds[c.id];
    var ev = c.eventId ? state.eventsById[c.eventId] : null;

    var actionsHtml = "";

      actionsHtml = '<div class="card-actions"><button class="btn btn-primary" data-action="approve-case-quick" data-id="' + c.id + '">✓ Godkjenn</button></div>';
    } else if (statusAtOrAfter(c.status, "godkjent") && c.status !== "publisert") {

        ? '<div class="card-actions"><button class="btn" data-action="download-manus" data-id="' + c.id + '" data-path="' + escapeHtml(c.manusUrl) + '">⬇ Last ned manus</button></div>'
        : '<div class="card-actions"><button class="btn" data-action="generate-manus" data-id="' + c.id + '"' + (state.ui.manusBusy[c.id] ? " disabled" : "") + ">" + (state.ui.manusBusy[c.id] ? "Genererer …" : "📄 Generer manus") + "</button></div>";
    }

    return (
      '<div class="card' + (checked ? " selected" : "") + '" draggable="true" data-action="open-case" data-id="' + c.id + '" role="button" tabindex="0">' +
        '<div class="card-top-row">' +
          '<input type="checkbox" class="card-select" data-select-id="' + c.id + '"' + (checked ? " checked" : "") + ' aria-label="Velg for massehandling" />' +
          '<button class="icon-btn card-delete" data-action="delete-case-quick" data-id="' + c.id + '" title="Slett sak" aria-label="Slett sak">✕</button>' +
        "</div>" +
        '<div class="chip-row">' +
          '<span class="chip chip-type-' + c.sakstype + '">' + TYPE_LABELS[c.sakstype] + "</span>" +
          '<span class="chip chip-urg-' + c.hastegrad + '">' + URGENCY_LABELS[c.hastegrad] + "</span>" +
          '<span class="chip chip-site">' + (SITE_LABELS[c.nettsted] || c.nettsted) + "</span>" +
          (c.isRss ? '<span class="chip chip-rss">RSS</span>' : "") +
          (ev ? '<span class="chip chip-event">📅 ' + escapeHtml(ev.title) + "</span>" : "") +
        "</div>" +
        '<div class="card-title">' + escapeHtml(c.title || "(uten tittel)") + "</div>" +
        (c.oppsummering ? '<div class="card-summary">' + escapeHtml(c.oppsummering) + "</div>" : "") +
        '<div class="card-meta"><span class="avatar">' + initials(c.eier) + "</span><span>" + escapeHtml(c.eier || "Ingen eier") + '</span><span class="meta-due' + (overdue ? " overdue" : "") + '">· ' + due + "</span></div>" +
        '<div class="score-row"><div class="score-meter"><div class="score-fill" style="width:' + score + '%;background:' + scoreColorVar(score) + ';"></div></div><span class="score-num">' + score + "</span></div>" +
        actionsHtml +
      "</div>"
    );
  }

  function statusOptionsMarkup(current) {
    return STATUSES.map(function (s) {
      return '<option value="' + s.id + '"' + (s.id === current ? " selected" : "") + ">" + s.label + "</option>";
    }).join("") + Object.keys(SIDE_STATUSES).map(function (k) {
      return '<option value="' + k + '"' + (k === current ? " selected" : "") + ">" + SIDE_STATUSES[k] + "</option>";
    }).join("");
  }

  function renderListView() {
    var order = STATUSES.map(function (s) { return s.id; }).concat(Object.keys(SIDE_STATUSES));
    var rows = state.cases.slice().sort(function (a, b) {
      var oa = order.indexOf(a.status), ob = order.indexOf(b.status);
      if (oa !== ob) return oa - ob;
      return computeScore(b.triage, state.weights) - computeScore(a.triage, state.weights);
    });
    var allSelected = rows.length > 0 && rows.every(function (c) { return state.ui.selectedIds[c.id]; });
    return (
      '<div class="list-wrap"><table class="list-table">' +
        "<thead><tr><th><input type=\"checkbox\" data-select-all" + (allSelected ? " checked" : "") + " aria-label=\"Velg alle\" /></th><th>Tittel</th><th>Type</th><th>Hastegrad</th><th>Nettsted</th><th>Journalist</th><th>Status</th><th>Frist</th><th>Score</th><th></th></tr></thead><tbody>" +
        (rows.length ? rows.map(function (c) {
          var score = computeScore(c.triage, state.weights);
          var due = fmtDue(c.frist);
          var overdue = c.frist && daysUntil(c.frist) < 0 && ["publisert", "arkivert", "avvist"].indexOf(c.status) === -1;
          var checked = !!state.ui.selectedIds[c.id];
          return (
            "<tr>" +
              '<td><input type="checkbox" data-select-id="' + c.id + '"' + (checked ? " checked" : "") + ' aria-label="Velg" /></td>' +
              '<td class="list-title" data-action="open-case" data-id="' + c.id + '">' + escapeHtml(c.title || "(uten tittel)") + "</td>" +
              '<td><span class="chip chip-type-' + c.sakstype + '">' + TYPE_LABELS[c.sakstype] + "</span></td>" +
              '<td><span class="chip chip-urg-' + c.hastegrad + '">' + URGENCY_LABELS[c.hastegrad] + "</span></td>" +
              '<td><span class="chip chip-site">' + (SITE_LABELS[c.nettsted] || c.nettsted) + "</span></td>" +
              "<td>" + escapeHtml(c.eier) + "</td>" +
              '<td><select data-list-status="' + c.id + '">' + statusOptionsMarkup(c.status) + "</select></td>" +
              '<td class="' + (overdue ? "overdue" : "") + '">' + due + "</td>" +
              '<td class="score-num">' + score + "</td>" +
              '<td><button class="icon-btn" data-action="delete-case-quick" data-id="' + c.id + '" title="Slett sak" aria-label="Slett sak">✕</button></td>' +
            "</tr>"
          );
        }).join("") : '<tr><td colspan="10" class="column-empty">Ingen saker</td></tr>') +
        "</tbody></table></div>"
    );
  }

  function buildAlerts() {
    var alerts = [];
    state.cases.forEach(function (c) {
      if (["publisert", "arkivert", "avvist"].indexOf(c.status) !== -1) return;
      if (c.frist) {
        var n = daysUntil(c.frist);
        if (n < 0) alerts.push({ icon: "⚠️", text: "Frist forfalt: <b>" + escapeHtml(c.title) + "</b>", ts: c.frist, alert: true });
        else if (n <= 2) alerts.push({ icon: "⏱️", text: "Frist nærmer seg: <b>" + escapeHtml(c.title) + "</b> (" + fmtDue(c.frist) + ")", ts: c.frist, alert: true });
      }
      if (c.eier === "Ikke tildelt" && c.status !== "ide") {
        alerts.push({ icon: "👤", text: "Mangler eier: <b>" + escapeHtml(c.title) + "</b>", ts: nowIso(), alert: true });
      }
    });
    return alerts;
  }

  function renderAside(alerts) {
    var feed = [];
    alerts.forEach(function (a) { feed.push({ icon: a.icon, html: a.text, ts: a.ts, alert: true }); });
    state.cases.forEach(function (c) {
      c.historikk.slice(0, 3).forEach(function (h) {
        feed.push({ icon: "•", html: escapeHtml(c.title) + " — " + escapeHtml(h.text), ts: h.ts, alert: false });
      });
    });
    feed.sort(function (a, b) { return new Date(b.ts) - new Date(a.ts); });
    feed = feed.slice(0, 30);

    var tabs =
      '<div class="aside-tabs">' +
        '<button class="aside-tab' + (state.ui.asideTab === "activity" ? " active" : "") + '" data-action="set-aside-tab" data-tab="activity">Aktivitet</button>' +
        '<button class="aside-tab' + (state.ui.asideTab === "chat" ? " active" : "") + '" data-action="set-aside-tab" data-tab="chat">💬 Assistent</button>' +
      "</div>";

    var body = state.ui.asideTab === "chat" ? renderChatBody() : (
      '<div class="aside-list">' +
        (feed.length ? feed.map(function (f) {
          return '<div class="activity-item' + (f.alert ? " alert" : "") + '"><span class="activity-icon">' + f.icon + '</span><span class="activity-body">' + f.html + '<span class="activity-time">' + fmtTime(f.ts) + "</span></span></div>";
        }).join("") : '<div class="aside-empty">Ingen aktivitet ennå</div>') +
      "</div>"
    );

    return (
      '<aside class="aside' + (state.ui.asideOpen ? " open" : "") + '">' +
        '<div class="aside-header"><span class="aside-title">' + (state.ui.asideTab === "chat" ? "Assistent" : "Aktivitet") + '</span><button class="icon-btn" data-action="toggle-aside" aria-label="Lukk">✕</button></div>' +
        tabs +
        body +
      "</aside>"
    );
  }

  function renderChatBody() {
    var msgs = state.chat.messages;
    var msgsHtml = msgs.length ? msgs.map(function (m) {
      if (m.role === "error") return '<div class="chat-msg error">⚠️ ' + escapeHtml(m.content) + "</div>";
      var actionsHtml = "";
      if (m.actions && m.actions.length) {
        actionsHtml = '<details class="chat-actions"><summary>' + m.actions.length + " handling(er) utført</summary><ul>" +
          m.actions.map(function (a) { return "<li>" + escapeHtml(a.tool) + (a.result && a.result.error ? " — avvist: " + escapeHtml(a.result.error) : "") + "</li>"; }).join("") +
          "</ul></details>";
      }
      return '<div class="chat-msg ' + (m.role === "user" ? "user" : "assistant") + '">' + escapeHtml(m.content) + actionsHtml + "</div>";
    }).join("") : '<div class="chat-empty">Spør om hva som helst i saksbanken — «hva står i Idé nå?», «opprett en sak om …», «godkjenn saken om antidrone-radar». Kan aldri publisere direkte — det krever alltid STOPP-kontroll i appen.</div>';

    return (
      '<div class="chat-messages" id="chat-messages">' + msgsHtml + (state.chat.busy ? '<div class="chat-typing">Tenker …</div>' : "") + "</div>" +
      '<form class="chat-input-row" id="chat-form">' +
        '<textarea id="chat-input" placeholder="Skriv en melding …" rows="1"' + (state.chat.busy ? " disabled" : "") + "></textarea>" +
        '<button class="btn btn-primary" type="submit"' + (state.chat.busy ? " disabled" : "") + ">Send</button>" +
      "</form>"
    );
  }

  function renderModal() {
    var m = state.ui.modal;
    if (!m) return "";
    if (m === "new-tip") return renderNewTipModal();
    if (m === "case") return renderCaseModal(getCase(state.ui.activeCaseId));
    if (m === "newsletter") return renderNewsletterModal();
    if (m === "weights") return renderWeightsModal();
    if (m === "about") return renderAboutModal();
    if (m === "sources") return renderSourcesModal();
    if (m === "cleanup-report") return renderCleanupReportModal();
    return "";
  }

  function renderNewTipModal() {
    return (
      '<div class="overlay center" data-action="close-modal-bg">' +
        '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="new-tip-title">' +
          '<div class="panel-header"><h2 id="new-tip-title">Nytt tips</h2><button class="icon-btn" data-action="close-modal">✕</button></div>' +
          '<form class="panel-body" id="new-tip-form">' +
            '<div class="field"><label for="nt-title">Tittel / kort beskrivelse</label><input id="nt-title" name="title" required placeholder="F.eks. Ny sone innført ved Gardermoen" /></div>' +
            '<div class="field"><label for="nt-kilde">Kilde / lenke</label><input id="nt-kilde" name="kilde" placeholder="Lim inn lenke eller skriv kilde" /></div>' +
            '<div class="field"><label for="nt-notat">Notat</label><textarea id="nt-notat" name="notat" placeholder="Kort notat om hvorfor dette kan være en sak"></textarea></div>' +
            '<div class="field-row">' +
              '<div class="field"><label for="nt-type">Sakstype</label><select id="nt-type" name="sakstype">' + optionsFor(TYPE_LABELS, "redaksjonell") + "</select></div>" +
              '<div class="field"><label for="nt-hastegrad">Hastegrad</label><select id="nt-hastegrad" name="hastegrad"><option value="akutt">Akutt</option><option value="planlagt" selected>Planlagt</option><option value="tidlos">Tidløs</option></select></div>' +
            "</div>" +
            '<div class="field"><label for="nt-eier">Journalist (valgfritt)</label><select id="nt-eier" name="eier">' +
              OWNERS.map(function (o) { return "<option" + (o === "Ikke tildelt" ? " selected" : "") + ">" + escapeHtml(o) + "</option>"; }).join("") +
            "</select></div>" +
            '<p class="helper">Saken legges i kolonnen «Idé» og er synlig for hele teamet med en gang.</p>' +
          "</form>" +
          '<div class="panel-footer"><button class="btn" data-action="close-modal">Avbryt</button><button class="btn btn-primary" data-action="submit-new-tip">Legg til tips</button></div>' +
        "</div>" +
      "</div>"
    );
  }

  function renderCaseModal(c) {
    if (!c) return "";
    var score = computeScore(c.triage, state.weights);
    var canPublish = c.status === "wp-utkast";
    var stoppReady = c.stoppGodkjent && c.publisertAv;
    var statusOptions = statusOptionsMarkup(c.status);
    return (
      '<div class="overlay" data-action="close-modal-bg">' +
        '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="case-title">' +
          '<div class="panel-header"><h2 id="case-title">Sak' + (c.isRss ? " · oppdaget via RSS" : "") + '</h2><button class="icon-btn" data-action="close-modal">✕</button></div>' +
          '<div class="panel-body">' +
            '<div class="field"><label for="c-title">Tittel</label><input id="c-title" data-field="title" value="' + escapeHtml(c.title) + '" /></div>' +
            '<div class="field-row">' +
              '<div class="field"><label for="c-type">Sakstype</label><select id="c-type" data-field="sakstype">' + optionsFor(TYPE_LABELS, c.sakstype) + "</select></div>" +
              '<div class="field"><label for="c-urg">Hastegrad</label><select id="c-urg" data-field="hastegrad">' + optionsFor(URGENCY_LABELS, c.hastegrad) + "</select></div>" +
            "</div>" +
            '<div class="field-row">' +
              '<div class="field"><label for="c-status">Status</label><select id="c-status" data-field="status">' + statusOptions + "</select></div>" +
              '<div class="field"><label for="c-site">Nettsted</label><select id="c-site" data-field="nettsted">' +
                SITES.map(function (s) { return '<option value="' + s + '"' + (s === c.nettsted ? " selected" : "") + ">" + (SITE_LABELS[s] || s) + "</option>"; }).join("") +
              "</select></div>" +
            "</div>" +
            '<div class="field-row">' +
              '<div class="field"><label for="c-eier">Journalist</label><select id="c-eier" data-field="eier">' +
                OWNERS.map(function (o) { return "<option" + (o === c.eier ? " selected" : "") + ">" + escapeHtml(o) + "</option>"; }).join("") +
              "</select></div>" +
              '<div class="field"><label for="c-frist">Frist</label><input id="c-frist" type="date" data-field="frist" value="' + escapeHtml(c.frist) + '" /></div>' +
            "</div>" +
            '<div class="field"><label for="c-neste">Neste handling</label><input id="c-neste" data-field="nesteHandling" value="' + escapeHtml(c.nesteHandling) + '" /></div>' +

            '<div class="section-label">AI-vurdering</div>' +
            '<div class="field"><label for="c-oppsummering">Sammendrag</label><textarea id="c-oppsummering" data-field="oppsummering" placeholder="Ikke vurdert av AI ennå">' + escapeHtml(c.oppsummering) + "</textarea></div>" +
            (c.eventId && state.eventsById[c.eventId] ? '<p class="helper">📅 Koblet til arrangement: <b>' + escapeHtml(state.eventsById[c.eventId].title) + "</b> (" + escapeHtml(state.eventsById[c.eventId].starts_on) + ")</p>" : "") +
            '<button class="btn" data-action="run-ai-triage-one" data-id="' + c.id + '"' + (state.ui.aiBusy[c.id] ? " disabled" : "") + ">" + (state.ui.aiBusy[c.id] ? "Vurderer …" : "Kjør AI-vurdering") + "</button>" +

            (c.status === "ide" ? '<button class="btn btn-primary" data-action="approve-case-quick" data-id="' + c.id + '" style="width:100%;">✓ Godkjenn idé → flytt til «Godkjente idéer»</button>' : "") +

            '<div class="field-row">' +
              '<div class="field"><label for="c-malgruppe">Målgruppe</label><select id="c-malgruppe" data-field="malgruppe">' +
                AUDIENCES.map(function (a) { return "<option" + (a === c.malgruppe ? " selected" : "") + ">" + escapeHtml(a) + "</option>"; }).join("") +
              "</select></div>" +
              '<div class="field"><label for="c-kategori">Kategori / tagger</label><input id="c-kategori" data-field="kategori" value="' + escapeHtml(c.kategori) + '" /></div>' +
            "</div>" +
            '<div class="field"><label>Kilder</label><div class="kilder-list" id="kilder-list">' +
              (c.kilder.length ? c.kilder.map(function (k, i) {
                return '<div class="kilde-row"><input data-kilde-idx="' + i + '" value="' + escapeHtml(k) + '" /><button class="icon-btn" data-action="remove-kilde" data-idx="' + i + '">✕</button></div>';
              }).join("") : "") +
            "</div><button class=\"btn\" data-action=\"add-kilde\" type=\"button\">+ Legg til kilde</button></div>" +
            '<div class="section-label">Prioriteringsmodell (forklarbar, kan justeres)</div>' +
            triageSlider("aktualitet", "Aktualitet", c.triage.aktualitet) +
            triageSlider("betydning", "Betydning", c.triage.betydning) +
            triageSlider("eksklusivitet", "Eksklusivitet", c.triage.eksklusivitet) +
            triageSlider("innsats", "Innsats", c.triage.innsats) +
            '<p class="helper">Score: <b style="color:' + scoreColorVar(score) + '">' + score + "/100</b> — vektet snitt av aktualitet, betydning og eksklusivitet, justert ned for høy innsats.</p>" +
            (canPublish || c.status === "publisert" ? (
              '<div class="section-label">Publiseringskontroll (STOPP)</div>' +
              '<div class="stopp-box' + (stoppReady ? " done" : "") + '">' +
                '<div class="stopp-title">' + (stoppReady ? "✅ Kontrollert og godkjent" : "🛑 Manuell kontroll kreves før publisering") + "</div>" +
                (c.status === "publisert" ? '<p class="helper">Godkjent av ' + escapeHtml(c.publisertAv || "—") + ".</p>" : (
                  '<label class="checkline"><input type="checkbox" id="c-stopp-check"' + (c.stoppGodkjent ? " checked" : "") + ' /> Jeg har lest og kontrollert hele saken (tekst, kilder, bilder, bildetekster).</label>' +
                  '<div class="field"><label for="c-godkjentav">Godkjent av</label><select id="c-godkjentav"><option value=""' + (c.publisertAv ? "" : " selected") + ">Velg godkjenner</option>" +
                    APPROVERS.map(function (a) { return "<option" + (a === c.publisertAv ? " selected" : "") + ">" + escapeHtml(a) + "</option>"; }).join("") +
                  "</select></div>" +
                  '<button class="btn btn-primary" data-action="publish-case" ' + (canPublish ? "" : "disabled") + '>Merk som publisert</button>' +
                  '<p class="helper">Uten kontroll og navn her kan saken ikke settes til Publisert — og tas dermed heller ikke med i nyhetsbrevet.</p>'
                )) +
              "</div>"
            ) : "") +
            (statusAtOrAfter(c.status, "godkjent") ? (
              '<div class="section-label">Manus</div>' +
              '<p class="helper">Genererer et førsteutkast (.docx) i UAS Norways malformat, basert på kildeteksten — les alltid gjennom og korriger før det lastes opp til WordPress.</p>' +
              '<button class="btn" data-action="generate-manus" data-id="' + c.id + '"' + (state.ui.manusBusy[c.id] ? " disabled" : "") + ">" + (state.ui.manusBusy[c.id] ? "Genererer …" : (c.manusUrl ? "Generer nytt manus" : "Generer manus (.docx)")) + "</button>" +
              (c.manusUrl ? (
                ' <button class="btn btn-primary" data-action="download-manus" data-id="' + c.id + '" data-path="' + escapeHtml(c.manusUrl) + '">Last ned manus</button>' +
                '<p class="helper">Sist generert: ' + fmtTime(c.manusGenerertTs) + "</p>"
              ) : "")
            ) : "") +

            '<div class="section-label">Historikk</div>' +
            '<div>' + c.historikk.map(function (h) {
              return '<div class="history-item"><span class="history-time">' + fmtTime(h.ts) + "</span><br />" + escapeHtml(h.text) + "</div>";
            }).join("") + "</div>" +
          "</div>" +
          '<div class="panel-footer"><button class="btn btn-danger" data-action="delete-case">Slett sak</button><div style="display:flex;gap:8px;"><button class="btn" data-action="close-modal">Lukk</button><button class="btn btn-primary" data-action="save-case">Lagre</button></div></div>' +
        "</div>" +
      "</div>"
    );
  }

  function optionsFor(labels, current) {
    return Object.keys(labels).map(function (k) {
      return '<option value="' + k + '"' + (k === current ? " selected" : "") + ">" + labels[k] + "</option>";
    }).join("");
  }
  function triageSlider(key, label, val) {
    return '<div class="slider-row"><label>' + label + '</label><input type="range" min="1" max="5" step="1" data-triage="' + key + '" value="' + val + '" /><span class="val">' + val + "</span></div>";
  }

  function renderWeightsModal() {
    var w = state.weights;
    var fields = [["aktualitet", "Aktualitet"], ["betydning", "Betydning"], ["eksklusivitet", "Eksklusivitet"], ["innsats", "Innsats (motvirker)"]];
    return (
      '<div class="overlay center" data-action="close-modal-bg">' +
        '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="weights-title">' +
          '<div class="panel-header"><h2 id="weights-title">Prioriteringsmodell</h2><button class="icon-btn" data-action="close-modal">✕</button></div>' +
          '<div class="panel-body"><p class="helper">Juster hvor mye hver faktor teller i triage-scoren (personlig visning, lagres kun i din nettleser).</p>' +
            '<div class="weights-grid">' + fields.map(function (f) {
              return '<div class="weight-field">' + f[1] + '<input type="number" min="0" max="3" step="0.5" data-weight="' + f[0] + '" value="' + w[f[0]] + '" /></div>';
            }).join("") + "</div>" +
          "</div>" +
          '<div class="panel-footer"><button class="btn" data-action="close-modal">Lukk</button><button class="btn btn-primary" data-action="save-weights">Lagre vekting</button></div>' +
        "</div>" +
      "</div>"
    );
  }

  function renderNewsletterModal() {
    var published = state.cases.filter(function (c) { return c.status === "publisert" && !c.nyhetsbrevInkludert; });
    var already = state.cases.filter(function (c) { return c.status === "publisert" && c.nyhetsbrevInkludert; });
    return (
      '<div class="overlay center" data-action="close-modal-bg">' +
        '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="nl-title">' +
          '<div class="panel-header"><h2 id="nl-title">Nyhetsbrevutkast</h2><button class="icon-btn" data-action="close-modal">✕</button></div>' +
          '<div class="panel-body">' +
            '<p class="helper">Henter kun saker med status <b>Publisert</b> som ikke allerede er tatt med i et tidligere utkast.</p>' +
            (published.length ? published.map(function (c) {
              return '<div class="newsletter-item"><input type="checkbox" checked data-nl-id="' + c.id + '" /> <span>' + escapeHtml(c.title) + '<br /><span class="helper">' + (SITE_LABELS[c.nettsted] || c.nettsted) + " · publisert av " + escapeHtml(c.publisertAv || "—") + "</span></span></div>";
            }).join("") : '<p class="aside-empty">Ingen nye publiserte saker å ta med akkurat nå.</p>') +
            (already.length ? '<p class="helper">' + already.length + " sak(er) er allerede inkludert i et tidligere utkast." : "") +
            '<div id="draft-output"></div>' +
          "</div>" +
          '<div class="panel-footer"><button class="btn" data-action="close-modal">Lukk</button><button class="btn btn-primary" data-action="generate-newsletter"' + (published.length ? "" : " disabled") + '>Generer utkast</button></div>' +
        "</div>" +
      "</div>"
    );
  }

  /* ---------- events ---------- */

  function bindEvents() {
    root.querySelectorAll("[data-action]").forEach(function (el) { el.addEventListener("click", handleAction); });
    root.querySelectorAll("[data-triage]").forEach(function (el) {
      el.addEventListener("input", function () { el.parentElement.querySelector(".val").textContent = el.value; });
    });
    root.querySelectorAll('.card[draggable="true"]').forEach(function (el) {
      el.addEventListener("dragstart", handleDragStart);
      el.addEventListener("dragend", handleDragEnd);
    });
    root.querySelectorAll(".column-body[data-status]").forEach(function (el) {
      el.addEventListener("dragover", handleDragOver);
      el.addEventListener("dragleave", handleDragLeave);
      el.addEventListener("drop", handleDrop);
    });
    root.querySelectorAll("[data-list-status]").forEach(function (el) {
      el.addEventListener("change", function () {
        var c = getCase(el.getAttribute("data-list-status"));
        if (c) trySetStatus(c, el.value, "listevisning");
      });
    });
    root.querySelectorAll("[data-toggle-source]").forEach(function (el) {
      el.addEventListener("change", function () {
        toggleSource(el.getAttribute("data-toggle-source"), el.checked);
      });
    });
    root.querySelectorAll("[data-select-id]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-select-id");
        if (el.checked) state.ui.selectedIds[id] = true;
        else delete state.ui.selectedIds[id];
        render();
      });
    });
    root.querySelectorAll("[data-select-all]").forEach(function (el) {
      el.addEventListener("change", function () {
        if (el.checked) state.cases.forEach(function (c) { state.ui.selectedIds[c.id] = true; });
        else state.ui.selectedIds = {};
        render();
      });
    });
    root.querySelectorAll('.card[role="button"]').forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
      });
    });

    var chatForm = document.getElementById("chat-form");
    if (chatForm) {
      chatForm.addEventListener("submit", function (e) {
        e.preventDefault();
        sendChatMessage();
      });
      var chatInput = document.getElementById("chat-input");
      chatInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
      });
    }
    var chatMessagesEl = document.getElementById("chat-messages");
    if (chatMessagesEl) chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  function focusChatInput() {
    setTimeout(function () {
      var el = document.getElementById("chat-input");
      if (el) el.focus();
    }, 0);
  }

  async function trySetStatus(c, newStatus, methodLabel) {
    var prevStatus = c.status;
    if (newStatus === prevStatus) return;
    if (newStatus === "publisert" && !(c.stoppGodkjent && c.publisertAv)) {
      showToast("Åpne saken og fullfør STOPP-kontrollen før den kan publiseres");
      state.ui.activeCaseId = c.id; state.ui.modal = "case"; render();
      return;
    }
    var historikk = [{ ts: nowIso(), text: "Status endret (" + methodLabel + "): " + statusLabel(prevStatus) + " → " + statusLabel(newStatus) }].concat(c.historikk);
    var ok = await updateCase(c.id, { status: newStatus, historikk: historikk });
    if (ok) { showToast("Status oppdatert"); await refreshAndRender(); }
  }

  function handleDragStart(e) {
    draggedId = e.currentTarget.getAttribute("data-id");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", draggedId); } catch (err) {}
    e.currentTarget.classList.add("dragging");
  }
  function handleDragEnd(e) { e.currentTarget.classList.remove("dragging"); draggedId = null; }
  function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
  function handleDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
  function handleDrop(e) {
    e.preventDefault(); e.currentTarget.classList.remove("drag-over");
    var id = draggedId || e.dataTransfer.getData("text/plain");
    var newStatus = e.currentTarget.getAttribute("data-status");
    var c = getCase(id);
    if (!c || !newStatus) return;
    trySetStatus(c, newStatus, "dra-og-slipp");
  }

  function handleAction(e) {
    var action = e.currentTarget.getAttribute("data-action");
    if (action === "close-modal-bg" && e.target !== e.currentTarget) return;
    switch (action) {
      case "set-view": state.ui.view = e.currentTarget.getAttribute("data-view"); render(); break;
      case "toggle-aside": state.ui.asideOpen = !state.ui.asideOpen; render(); break;
      case "open-chat": state.ui.asideOpen = true; state.ui.asideTab = "chat"; render(); focusChatInput(); break;
      case "set-aside-tab": state.ui.asideTab = e.currentTarget.getAttribute("data-tab"); render(); if (state.ui.asideTab === "chat") focusChatInput(); break;
      case "open-new-tip": state.ui.modal = "new-tip"; render(); break;
      case "open-case": state.ui.activeCaseId = e.currentTarget.getAttribute("data-id"); state.ui.modal = "case"; render(); break;
      case "open-newsletter": state.ui.modal = "newsletter"; render(); break;
      case "open-weights": state.ui.modal = "weights"; render(); break;
      case "open-about": state.ui.modal = "about"; render(); break;
      case "open-sources": openSources(); break;
      case "delete-case-quick": e.stopPropagation(); quickDeleteCase(e.currentTarget.getAttribute("data-id")); break;
      case "delete-selected": deleteSelected(); break;
      case "clear-selection": state.ui.selectedIds = {}; render(); break;
      case "import-sources": importSources(); break;
      case "delete-source": deleteSource(e.currentTarget.getAttribute("data-id")); break;
      case "run-ai-triage-bulk": runAiTriageBulk(); break;
      case "cleanup-irrelevant": runCleanupIrrelevant(); break;
      case "run-ai-triage-one": runAiTriage([e.currentTarget.getAttribute("data-id")]); break;
      case "run-ai-triage-selected": e.stopPropagation(); runAiTriageSelected(); break;
      case "generate-manus": e.stopPropagation(); generateManuscriptForCase(e.currentTarget.getAttribute("data-id")); break;
      case "download-manus": e.stopPropagation(); downloadManus(e.currentTarget.getAttribute("data-id"), e.currentTarget.getAttribute("data-path")); break;
      case "approve-case-quick": e.stopPropagation(); approveCaseQuick(e.currentTarget.getAttribute("data-id")); break;
      case "approve-selected": e.stopPropagation(); moveSelected("godkjent"); break;
      case "move-selected": e.stopPropagation(); moveSelected(document.getElementById("bulk-status-select").value); break;
      case "close-modal": case "close-modal-bg": state.ui.modal = null; state.ui.activeCaseId = null; render(); break;
      case "submit-new-tip": submitNewTip(); break;
      case "save-case": saveCaseFromForm(); break;
      case "publish-case": publishCaseFromForm(); break;
      case "delete-case": deleteActiveCase(); break;
      case "add-kilde": addKildeRow(); break;
      case "remove-kilde": removeKildeRow(parseInt(e.currentTarget.getAttribute("data-idx"), 10)); break;
      case "save-weights": saveWeights(); break;
      case "generate-newsletter": generateNewsletter(); break;
      case "sign-out": signOut(); break;
    }
  }

  async function submitNewTip() {
    var form = document.getElementById("new-tip-form");
    var title = form.querySelector("#nt-title").value.trim();
    if (!title) { form.querySelector("#nt-title").focus(); return; }
    var kilde = form.querySelector("#nt-kilde").value.trim();
    var notat = form.querySelector("#nt-notat").value.trim();
    var sakstype = form.querySelector("#nt-type").value;
    var hastegrad = form.querySelector("#nt-hastegrad").value;
    var eier = form.querySelector("#nt-eier").value;
    var created = await createCase({
      title: title, sakstype: sakstype, hastegrad: hastegrad, status: "ide", eier: eier,
      kilder: kilde ? [kilde] : [], neste_handling: notat || "Vurder relevans og vinkel",
      historikk: [{ ts: nowIso(), text: "Sak opprettet (tips)" }]
    });
    if (!created) return;
    state.ui.modal = null;
    await refreshAndRender();
    showToast("Tips lagt til i «Idé»");
  }

  function readCaseForm() {
    var c = getCase(state.ui.activeCaseId);
    if (!c) return null;
    root.querySelectorAll("[data-field]").forEach(function (el) { c[el.getAttribute("data-field")] = el.value; });
    root.querySelectorAll("[data-triage]").forEach(function (el) { c.triage[el.getAttribute("data-triage")] = parseInt(el.value, 10); });
    var kildeInputs = root.querySelectorAll("[data-kilde-idx]");
    if (kildeInputs.length) c.kilder = Array.prototype.map.call(kildeInputs, function (el) { return el.value; });
    return c;
  }

  async function saveCaseFromForm() {
    var before = getCase(state.ui.activeCaseId);
    var prevStatus = before ? before.status : null;
    var c = readCaseForm();
    if (!c) return;
    if (c.status !== prevStatus) {
      if (c.status === "publisert" && !(c.stoppGodkjent && c.publisertAv)) {
        c.status = prevStatus;
        showToast("Kan ikke sette Publisert uten fullført STOPP-kontroll");
      } else {
        c.historikk = [{ ts: nowIso(), text: "Status endret: " + statusLabel(prevStatus) + " → " + statusLabel(c.status) }].concat(c.historikk);
      }
    }
    var ok = await updateCase(c.id, caseToDbUpdate(c));
    if (!ok) return;
    state.ui.modal = null; state.ui.activeCaseId = null;
    await refreshAndRender();
    showToast("Sak lagret");
  }

  async function publishCaseFromForm() {
    var c = readCaseForm();
    if (!c) return;
    var check = document.getElementById("c-stopp-check");
    var godkjentAv = document.getElementById("c-godkjentav");
    c.stoppGodkjent = !!(check && check.checked);
    c.publisertAv = godkjentAv ? godkjentAv.value.trim() : "";
    if (!c.stoppGodkjent || !c.publisertAv) { showToast("Kryss av kontroll og fyll inn hvem som godkjenner"); render(); return; }
    c.status = "publisert";
    c.historikk = [{ ts: nowIso(), text: "Publisert av " + c.publisertAv + " etter manuell kontroll" }].concat(c.historikk);
    var ok = await updateCase(c.id, caseToDbUpdate(c));
    if (!ok) return;
    await refreshAndRender();
    showToast("Sak publisert");
  }

  async function deleteActiveCase() {
    if (!window.confirm("Slette denne saken permanent?")) return;
    var id = state.ui.activeCaseId;
    var ok = await deleteCase(id);
    if (!ok) return;
    state.ui.modal = null; state.ui.activeCaseId = null;
    await refreshAndRender();
    showToast("Sak slettet");
  }

  async function quickDeleteCase(id) {
    var c = getCase(id);
    if (!window.confirm('Slette "' + (c ? c.title : "denne saken") + '" permanent?')) return;
    var ok = await deleteCase(id);
    if (!ok) return;
    delete state.ui.selectedIds[id];
    await refreshAndRender();
    showToast("Sak slettet");
  }

  async function deleteSelected() {
    var ids = Object.keys(state.ui.selectedIds);
    if (!ids.length) return;
    if (!window.confirm("Slette " + ids.length + " valgte sak(er) permanent? Dette kan ikke angres.")) return;
    var ok = await deleteCases(ids);
    if (!ok) return;
    state.ui.selectedIds = {};
    await refreshAndRender();
    showToast(ids.length + " sak(er) slettet");
  }

  async function approveCaseQuick(id) {
    var c = getCase(id);
    if (!c) return;
    await trySetStatus(c, "godkjent", "godkjenn-knapp");
  }

  async function moveSelected(targetStatus) {
    var ids = Object.keys(state.ui.selectedIds);
    if (!ids.length) return;
    if (targetStatus === "publisert") {
      showToast("Publisering krever STOPP-kontroll per sak — åpne saken enkeltvis for å publisere");
      return;
    }
    var cases = ids.map(getCase).filter(Boolean);
    if (!cases.length) return;
    for (var i = 0; i < cases.length; i++) {
      var c = cases[i];
      if (c.status === targetStatus) continue;
      var historikk = [{ ts: nowIso(), text: "Status endret (massehandling): " + statusLabel(c.status) + " → " + statusLabel(targetStatus) }].concat(c.historikk);
      await updateCase(c.id, { status: targetStatus, historikk: historikk });
    }
    state.ui.selectedIds = {};
    await refreshAndRender();
    showToast(cases.length + " sak(er) flyttet til «" + statusLabel(targetStatus) + "»");
  }

  async function runAiTriageSelected() {
    var ids = Object.keys(state.ui.selectedIds);
    if (!ids.length) return;
    state.ui.selectedIds = {};
    await runAiTriage(ids);
  }

  function addKildeRow() { var c = readCaseForm(); if (!c) return; c.kilder.push(""); render(); }
  function removeKildeRow(idx) { var c = readCaseForm(); if (!c) return; c.kilder.splice(idx, 1); render(); }

  function saveWeights() {
    root.querySelectorAll("[data-weight]").forEach(function (el) { state.weights[el.getAttribute("data-weight")] = parseFloat(el.value) || 0; });
    persistWeights();
    state.ui.modal = null; render();
    showToast("Vekting lagret");
  }

  async function openSources() {
    state.ui.modal = "sources";
    state.ui.importReport = null;
    render();
    await fetchSources();
    render();
  }

  async function importSources() {
    var textarea = document.getElementById("bulk-sources-input");
    var text = textarea ? textarea.value.trim() : "";
    if (!text) { showToast("Lim inn minst én RSS-lenke først"); return; }
    if (!state.session) { showToast("Du må være innlogget"); return; }

    state.ui.importBusy = true;
    render();

    try {
      var res = await fetch("/.netlify/functions/add-sources", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.session.access_token },
        body: JSON.stringify({ text: text })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) {
        showToast(data.error || "Import feilet");
        state.ui.importBusy = false;
        render();
        return;
      }
      state.ui.importReport = data;
      state.ui.importBusy = false;
      await fetchSources();
      render();
      showToast(data.added.length + " kilde(r) lagt til");
    } catch (err) {
      state.ui.importBusy = false;
      render();
      showToast("Import feilet: " + err.message);
    }
  }

  async function toggleSource(id, active) {
    var res = await supabase.from("sources").update({ active: active }).eq("id", id);
    if (res.error) { showToast("Kunne ikke oppdatere: " + res.error.message); return; }
    await fetchSources();
    render();
  }

  async function deleteSource(id) {
    if (!window.confirm("Slette denne RSS-kilden? Tidligere innhentede saker beholdes.")) return;
    var res = await supabase.from("sources").delete().eq("id", id);
    if (res.error) { showToast("Kunne ikke slette: " + res.error.message); return; }
    await fetchSources();
    render();
    showToast("Kilde slettet");
  }

  function authHeader() {
    return { "Content-Type": "application/json", "Authorization": "Bearer " + state.session.access_token };
  }

  // Netlify-funksjoner returnerer alltid JSON når de faktisk kjører — men ved
  // tidsavbrudd (for store/trege forespørsler) eller andre serverfeil svarer
  // Netlify selv med en HTML-feilside i stedet. Uten dette gir et slikt svar
  // en kryptisk "Unexpected token '<'"-feil i stedet for noe brukbart.
  async function parseFunctionResponse(res) {
    var text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error(
        res.ok
          ? "Fikk et uventet svar fra serveren (ikke gyldig JSON)."
          : "Serverfunksjonen svarte ikke som forventet (HTTP " + res.status + ") — sannsynligvis tidsavbrudd fordi forespørselen tok for lang tid. Prøv med færre saker om gangen."
      );
    }
  }

  async function runAiTriageBulk() {
    var ids = state.cases.filter(function (c) { return c.status === "ide"; }).map(function (c) { return c.id; });
    if (!ids.length) { showToast("Ingen idéer å vurdere"); return; }
    state.ui.aiBulkBusy = true;
    render();
    await runAiTriage(ids, true);
    state.ui.aiBulkBusy = false;
    render();
  }

  async function runAiTriage(ids, quiet) {
    ids.forEach(function (id) { state.ui.aiBusy[id] = true; });
    if (!quiet) render();
    try {
      var res = await fetch("/.netlify/functions/ai-triage", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseIds: ids })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "AI-vurdering feilet"); return; }
      var msg = data.vurdert + " sak(er) vurdert";
      if (data.feilet && data.feilet.length) msg += ", " + data.feilet.length + " feilet";
      showToast(msg);
      await fetchEvents();
      await refreshAndRender();
    } catch (err) {
      showToast("AI-vurdering feilet: " + err.message);
    } finally {
      ids.forEach(function (id) { delete state.ui.aiBusy[id]; });
      render();
    }
  }

  async function sendChatMessage() {
    var input = document.getElementById("chat-input");
    var text = input ? input.value.trim() : "";
    if (!text || state.chat.busy) return;

    var history = state.chat.messages
      .filter(function (m) { return m.role === "user" || m.role === "assistant"; })
      .map(function (m) { return { role: m.role, content: m.content }; });

    state.chat.messages.push({ role: "user", content: text });
    state.chat.busy = true;
    render();

    try {
      var res = await fetch("/.netlify/functions/assistant-chat", {
        method: "POST", headers: authHeader(),
        body: JSON.stringify({ message: text, history: history })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) {
        state.chat.messages.push({ role: "error", content: data.error || "Assistenten svarte ikke." });
      } else {
        state.chat.messages.push({ role: "assistant", content: data.reply || "(tomt svar)", actions: data.actions || [] });
        if (data.actions && data.actions.length) await fetchCases();
      }
    } catch (err) {
      state.chat.messages.push({ role: "error", content: err.message });
    } finally {
      state.chat.busy = false;
      render();
      focusChatInput();
    }
  }

  async function runCleanupIrrelevant() {
    if (!window.confirm("Kjør AI-vurdering av alle idéer i «Idé»-kolonnen og fjern de som ikke handler om droner/UAS. Kan ikke angres. Fortsette?")) return;
    state.ui.cleanupBusy = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/cleanup-irrelevant", {
        method: "POST", headers: authHeader(), body: "{}"
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "Rydding feilet"); return; }
      state.ui.cleanupReport = data;
      state.ui.cleanupBusy = false;
      state.ui.modal = "cleanup-report";
      await refreshAndRender();
      showToast(data.fjernet.length + " fjernet, " + data.beholdt + " beholdt");
    } catch (err) {
      showToast("Rydding feilet: " + err.message);
    } finally {
      state.ui.cleanupBusy = false;
      render();
    }
  }

  async function generateManuscriptForCase(id) {
    state.ui.manusBusy[id] = true;
    render();
    try {
      var res = await fetch("/.netlify/functions/generate-manuscript", {
        method: "POST", headers: authHeader(), body: JSON.stringify({ caseId: id })
      });
      var data = await parseFunctionResponse(res);
      if (!res.ok) { showToast(data.error || "Kunne ikke generere manus"); return; }
      var msg = "Manus generert" + (data.harBilde ? "" : " (uten bilde — sett inn manuelt)");
      showToast(msg);
      if (data.usikkerhetsnotat) showToast("⚠️ " + data.usikkerhetsnotat);
      await refreshAndRender();
    } catch (err) {
      showToast("Kunne ikke generere manus: " + err.message);
    } finally {
      delete state.ui.manusBusy[id];
      render();
    }
  }

  async function downloadManus(id, path) {
    var res = await supabase.storage.from("manus").download(path);
    if (res.error) { showToast("Kunne ikke laste ned manus: " + res.error.message); return; }
    var c = getCase(id);
    var filename = (c ? c.title.replace(/[^a-z0-9æøå]+/gi, "-").toLowerCase().slice(0, 60) : "manus") + ".docx";
    var url = URL.createObjectURL(res.data);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  async function generateNewsletter() {
    var ids = Array.prototype.slice.call(root.querySelectorAll("[data-nl-id]")).filter(function (el) { return el.checked; }).map(function (el) { return el.getAttribute("data-nl-id"); });
    var cases = ids.map(getCase).filter(Boolean);
    if (!cases.length) return;
    var lines = ["UAS Norway / Dronemagasinet — nyhetsbrevutkast", "=".repeat(44), ""];
    cases.forEach(function (c) {
      lines.push("• " + c.title);
      lines.push("  (" + (SITE_LABELS[c.nettsted] || c.nettsted) + ")");
      if (c.kilder[0]) lines.push("  " + c.kilder[0]);
      lines.push("");
    });
    lines.push("— Generert fra saker med status Publisert. Ikke sendt automatisk; kopier inn i Mailchimp-utkast.");
    var text = lines.join("\n");

    for (var i = 0; i < cases.length; i++) {
      var c = cases[i];
      var historikk = [{ ts: nowIso(), text: "Inkludert i nyhetsbrevutkast" }].concat(c.historikk);
      await updateCase(c.id, { nyhetsbrev_inkludert: true, historikk: historikk });
    }
    await fetchCases();

    var out = document.getElementById("draft-output");
    if (out) {
      out.innerHTML = '<div class="section-label">Utkast</div><div class="draft-box">' + escapeHtml(text) + '</div><button class="btn" style="margin-top:10px;" id="copy-draft-btn" type="button">Kopier tekst</button>';
      document.getElementById("copy-draft-btn").addEventListener("click", function () {
        if (navigator.clipboard) navigator.clipboard.writeText(text);
        showToast("Kopiert");
      });
    }
  }

  function showToast(msg) {
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  /* ---------- auth ---------- */

  function renderLoginScreen(status, statusType) {
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">' +
        "<h1>Saksbank — UAS Norway</h1>" +
        "<p>Logg inn med e-postadressen din. Du får tilsendt en lenke — ingen passord å huske.</p>" +
        '<form id="login-form" class="field">' +
          '<label for="login-email">E-post</label>' +
          '<input id="login-email" type="email" required placeholder="navn@uasnorway.no" />' +
          '<button class="btn btn-primary" type="submit" style="margin-top:10px;">Send innloggingslenke</button>' +
        "</form>" +
        (status ? '<p class="login-status ' + (statusType || "") + '">' + escapeHtml(status) + "</p>" : "") +
      "</div></div>";
    var form = document.getElementById("login-form");
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      if (!email) return;
      var res = await supabase.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin } });
      if (res.error) renderLoginScreen("Kunne ikke sende lenke: " + res.error.message, "error");
      else renderLoginScreen("Sjekk innboksen til " + email + " for innloggingslenken.", "ok");
    });
  }

  function renderNotConfiguredScreen() {
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">' +
        "<h1>Saksbank — ikke koblet til database ennå</h1>" +
        '<p>SUPABASE_URL og SUPABASE_ANON_KEY er ikke fylt inn i <code>public/index.html</code>. Se README.md for stegene.</p>' +
      "</div></div>";
  }

  function signOut() { supabase.auth.signOut(); }

  var realtimeChannel = null;
  function subscribeRealtime() {
    if (realtimeChannel) return;
    realtimeChannel = supabase
      .channel("cases-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "cases" }, function () {
        refreshAndRender();
      })
      .subscribe(function (status) {
        state.realtimeOk = status === "SUBSCRIBED";
        render();
      });
  }

  async function boot() {
    if (!CONFIGURED) { renderNotConfiguredScreen(); return; }

    var sessionRes = await supabase.auth.getSession();
    state.session = sessionRes.data.session;

    supabase.auth.onAuthStateChange(function (_event, session) {
      state.session = session;
      if (session) { subscribeRealtime(); refreshAndRender(); }
      else { renderLoginScreen(); }
    });

    if (!state.session) { renderLoginScreen(); return; }

    loadWeights();
    subscribeRealtime();
    await Promise.all([refreshAndRender(), fetchEvents()]);
    render();
  }

  boot();
})();
</script>
</body>
</html>
